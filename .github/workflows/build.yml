name: Build YouTube Lumi & YT Music Lumi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load signing key from Secrets
        env:
          KS_B64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets LUMI_KEYSTORE_BASE64 / LUMI_KEYSTORE_PASSWORD belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lumitube.jks"
          echo "LUMI_KEYSTORE_PATH=$RUNNER_TEMP/lumitube.jks" >> "$GITHUB_ENV"
          echo "LUMI_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleYoutubeRelease :app:assembleMusicRelease --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Read version
        id: ver
        run: |
          TAG=$(tr -d ' \r\n' < release-notes/CURRENT)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/youtube/release/app-youtube-release.apk "out/YouTubeLumi-${{ steps.ver.outputs.tag }}.apk"
          cp app/build/outputs/apk/music/release/app-music-release.apk "out/YTMusicLumi-${{ steps.ver.outputs.tag }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-apks
          path: out/*.apk

      # Satu rilis per versi (release-notes/CURRENT, mis. v2.0). Push berikutnya memperbarui
      # APK di rilis versi itu; tidak ada lagi "dev build".
      # Tag versi selalu menunjuk commit terbaru, supaya "Source code (zip/tar.gz)"
      # di halaman rilis ikut diperbarui bersama APK-nya.
      - name: Move version tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f "${{ steps.ver.outputs.tag }}" "${{ github.sha }}"
          git push -f origin "refs/tags/${{ steps.ver.outputs.tag }}"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "✦ LumiTube ${{ steps.ver.outputs.tag }}"
          body_path: release-notes/${{ steps.ver.outputs.tag }}.md
          files: out/*.apk
          overwrite_files: true
          make_latest: "true"

      - name: Clean up old dev builds and old asset names
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          for t in $(gh release list -R "$REPO" --limit 200 --json tagName -q '.[].tagName' | grep '^build-' || true); do
            gh release delete "$t" -R "$REPO" --cleanup-tag -y || true
          done
          for a in YouTubeLumi.apk YTMusicLumi.apk; do
            gh release delete-asset "$TAG" "$a" -R "$REPO" -y 2>/dev/null || true
          done
