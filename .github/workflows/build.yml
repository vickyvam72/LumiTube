name: Build YouTube Lumi & YT Music Lumi

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleYoutubeRelease :app:assembleMusicRelease --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/youtube/release/app-youtube-release.apk YouTubeLumi.apk
          cp app/build/outputs/apk/music/release/app-music-release.apk YTMusicLumi.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-apks
          path: |
            YouTubeLumi.apk
            YTMusicLumi.apk

      # Tag vX.Y -> rilis resmi dengan catatan dari release-notes/vX.Y.md
      - name: Publish official release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "✦ LumiTube ${{ github.ref_name }}"
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            YouTubeLumi.apk
            YTMusicLumi.apk
          make_latest: "true"

      # Push biasa ke main -> build pengembangan (pre-release, tidak menggeser rilis resmi)
      - name: Publish development build
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "🧪 Dev build ${{ github.run_number }}"
          body: |
            Automatic development build from the latest commit. For the stable version, use the latest **LumiTube** release.
            Build pengembangan otomatis dari commit terbaru. Untuk versi stabil, pakai rilis **LumiTube** terbaru.
          prerelease: true
          files: |
            YouTubeLumi.apk
            YTMusicLumi.apk
          make_latest: "false"
