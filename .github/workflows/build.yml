name: Build YouTube Lumi & YT Music Lumi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleYoutubeRelease :app:assembleMusicRelease --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/youtube/release/app-youtube-release.apk YouTubeLumi.apk
          cp app/build/outputs/apk/music/release/app-music-release.apk YTMusicLumi.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-apks
          path: |
            YouTubeLumi.apk
            YTMusicLumi.apk

      # Rilis resmi: versi di release-notes/CURRENT (mis. v2.0) dirilis sekali, dengan catatan
      # dari release-notes/<versi>.md. Push berikutnya menjadi build pengembangan (pre-release).
      - name: Decide release type
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(tr -d ' \r\n' < release-notes/CURRENT 2>/dev/null || true)
          if [ -n "$TAG" ] && [ -f "release-notes/$TAG.md" ] && ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "official=true" >> "$GITHUB_OUTPUT"
          else
            echo "official=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish official release
        if: steps.rel.outputs.official == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "✦ LumiTube ${{ steps.rel.outputs.tag }}"
          body_path: release-notes/${{ steps.rel.outputs.tag }}.md
          files: |
            YouTubeLumi.apk
            YTMusicLumi.apk
          make_latest: "true"

      - name: Publish development build
        if: steps.rel.outputs.official != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "🧪 Dev build ${{ github.run_number }}"
          body: |
            Automatic development build from the latest commit. For the stable version, use the latest **LumiTube** release.
            Build pengembangan otomatis dari commit terbaru. Untuk versi stabil, pakai rilis **LumiTube** terbaru.
          prerelease: true
          files: |
            YouTubeLumi.apk
            YTMusicLumi.apk
          make_latest: "false"
