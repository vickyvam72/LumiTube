name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST "https://www.youtube.com/youtubei/v1/search?prettyPrint=false" -H "Content-Type: application/json" \
            -d '{"context":{"client":{"clientName":"WEB","clientVersion":"2.20251001.00.00","hl":"id","gl":"ID"}},"query":"emotion"}' > s.json
          python3 - <<'PY'
          import json
          d=json.load(open('s.json'))
          def walk(o,path=""):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if k in ("chipCloudChipRenderer","chipViewModel","searchHeaderRenderer"):
                          print(path+"/"+k, json.dumps(v)[:1500]); print()
                      walk(v,path+"/"+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o): walk(v,path+f"[{i}]")
          walk(d)
          PY
