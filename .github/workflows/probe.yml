name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request, re
          CTX={"client":{"clientName":"WEB","clientVersion":"2.20251001.00.00","hl":"id","gl":"ID"}}
          def post(ep,body):
              body["context"]=CTX
              req=urllib.request.Request("https://www.youtube.com/youtubei/v1/"+ep+"?prettyPrint=false",data=json.dumps(body).encode(),headers={"Content-Type":"application/json"})
              try: return json.load(urllib.request.urlopen(req))
              except Exception as e: return {"ERR":str(e)+" "+(e.read().decode()[:300] if hasattr(e,'read') else '')}
          out=[]
          def summ(name,r):
              s=json.dumps(r)
              out.append("== %s keys=%s len=%d"%(name,list(r.keys()),len(s)))
              out.append("   ERR "+str(r.get("ERR"))[:400]) if "ERR" in r else None
              out.append("   seqCont="+str(r.get("sequenceContinuation"))[:80])
              out.append("   reelIds=%s"%re.findall(r'"reelWatchEndpoint": \{"videoId": "([^"]+)"',s)[:12])
              out.append("   tokens=%s"%[t[:40] for t in re.findall(r'"token": "([^"]+)"',s)[:4]])
          s=post("search",{"query":"tretan muslim #shorts"})
          ss=json.dumps(s)
          ids=re.findall(r'"reelWatchEndpoint": \{[^{}]*?"videoId": "([^"]+)"',ss) or re.findall(r'shorts-shelf-item-([A-Za-z0-9_-]{11})',ss)
          out.append("search reel ids %s"%ids[:5])
          allv=re.findall(r'"videoId": "([A-Za-z0-9_-]{11})"',ss)
          out.append("any ids %s; has shortsLockup=%s reelWatch=%s"%(allv[:5], "shortsLockupViewModel" in ss, "reelWatchEndpoint" in ss))
          seed=ids[0] if ids else (allv[0] if allv else "dQw4w9WgXcQ")
          if seed:
              m=re.search(r'"reelWatchEndpoint": (\{"videoId": "%s".*?\})\s*[,}]'%seed, ss)
              i=ss.find('"reelWatchEndpoint"'); out.append("reelWatchEndpoint sample "+ss[i:i+900])
          def seqkeys(o,path=""):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if "equence" in k: out.append("  SEQ %s/%s = %s"%(path[-80:],k,json.dumps(v)[:300]))
                      seqkeys(v,path+"/"+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o): seqkeys(v,path+"[%d]"%i)
          for pr in ("CAUwAg%3D%3D","CAUwAg==",None):
              body={"playerRequest":{"videoId":seed},"disablePlayerResponse":True}
              if pr: body["params"]=pr
              r1=post("reel/reel_item_watch",body)
              out.append("== item_watch params=%s keys=%s"%(pr,list(r1.keys())))
              seqkeys(r1)
          import base64
          vid=seed.encode()
          c=base64.urlsafe_b64encode(b"\x0a"+bytes([len(vid)])+vid).decode()
          r2=post("reel/reel_watch_sequence",{"sequenceParams":c})
          ents=r2.get("entries",[])
          out.append("entries %d"%len(ents))
          for e in ents[:3]:
              rw=e.get("command",{}).get("reelWatchEndpoint",{})
              vd=rw.get("unserializedPrefetchData",{}).get("playerResponse",{}).get("videoDetails",{})
              out.append("  %s | %s | %s | %s | views=%s len=%s"%(rw.get("videoId"),vd.get("title"),vd.get("author"),vd.get("channelId"),vd.get("viewCount"),vd.get("lengthSeconds")))
              out.append("  entry keys "+str(list(e.keys()))+" cmd keys "+str(list(e.get("command",{}).keys())) + " rw keys "+str(list(rw.keys())))
          out.append("contEndpoint "+json.dumps(r2.get("continuationEndpoint"))[:500])
          tok=r2.get("continuationEndpoint",{}).get("continuationCommand",{}).get("token")
          for mode in ("sequenceParams","continuation"):
              r3=post("reel/reel_watch_sequence",{mode:tok})
              ids3=[e.get("command",{}).get("reelWatchEndpoint",{}).get("videoId") for e in r3.get("entries",[])]
              out.append("page2 via %s keys=%s ids=%s err=%s"%(mode,list(r3.keys()),ids3[:8],str(r3.get("ERR"))[:150]))
          open("probe2.txt","w").write("\n".join(x for x in out if x))
          PY
          python3 p.py > log.txt 2>&1 || true
          cat log.txt >> probe2.txt || cp log.txt probe2.txt
          gh api -X PUT repos/${{ github.repository }}/contents/probe-${{ github.run_id }}.txt -f message=probe -f branch=probe-out -f content="$(base64 -w0 probe2.txt)"
        env:
          GH_TOKEN: ${{ github.token }}
