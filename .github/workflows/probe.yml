name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST "https://www.youtube.com/youtubei/v1/search?prettyPrint=false" -H "Content-Type: application/json" \
            -d '{"context":{"client":{"clientName":"WEB","clientVersion":"2.20251001.00.00","hl":"id","gl":"ID"}},"query":"emotion"}' > s.json
          python3 - <<'PY'
          import json
          d=json.load(open('s.json'))
          def walk(o,path=""):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if k in ("chipCloudChipRenderer","chipViewModel","searchHeaderRenderer"):
                          print(path+"/"+k, json.dumps(v)[:1500]); print()
                      walk(v,path+"/"+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o): walk(v,path+f"[{i}]")
          walk(d)
          PY
      - run: |
          python3 -c "
          import json
          d=json.load(open('s.json'))
          out=[]
          def walk(o,path=''):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if k in ('chipCloudChipRenderer','chipViewModel'):
                          out.append(path+'/'+k+' '+json.dumps(v)[:2500])
                      walk(v,path+'/'+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o): walk(v,path+'[%d]'%i)
          walk(d)
          open('probe.txt','w').write('\\n\\n'.join(out))
          "
          gh api -X PUT repos/${{ github.repository }}/contents/probe.txt -f message=probe -f branch=probe-out -f content="$(base64 -w0 probe.txt)" || (gh api -X POST repos/${{ github.repository }}/git/refs -f ref=refs/heads/probe-out -f sha=${{ github.sha }} && gh api -X PUT repos/${{ github.repository }}/contents/probe.txt -f message=probe -f branch=probe-out -f content="$(base64 -w0 probe.txt)")
        env:
          GH_TOKEN: ${{ github.token }}
