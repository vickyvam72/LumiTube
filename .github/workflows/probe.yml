name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request, re
          CTX={"client":{"clientName":"WEB","clientVersion":"2.20251001.00.00","hl":"id","gl":"ID"}}
          def post(body):
              body["context"]=CTX
              req=urllib.request.Request("https://www.youtube.com/youtubei/v1/search?prettyPrint=false",data=json.dumps(body).encode(),headers={"Content-Type":"application/json"})
              return json.load(urllib.request.urlopen(req))
          out=[]
          def ids(r):
              s=json.dumps(r)
              v=re.findall(r'"videoRenderer": \{"videoId": "([^"]+)"',s)
              return v
          def conts(r):
              res=[]
              def w(o,skip=False):
                  if isinstance(o,dict):
                      for k,v in o.items():
                          if k in ("chipCloudRenderer","header","searchHeaderRenderer"): continue
                          if k=="continuationItemRenderer": res.append(json.dumps(v))
                          w(v)
                  elif isinstance(o,list):
                      for v in o: w(v)
              w(r); return res
          d=post({"query":"gadget in"})
          out.append("SEMUA ids %d conts %s"%(len(ids(d)),conts(d)[:1]))
          chips={}
          for m in re.finditer(r'"chipCloudChipRenderer": (\{.*?"location": "[A-Z_]+"\})',json.dumps(d)):
              c=json.loads(m.group(1)); t=c["text"].get("simpleText")
              tok=c.get("navigationEndpoint",{}).get("continuationCommand",{}).get("token")
              chips[t]=tok
          out.append("CHIPS "+str(list(chips)))
          for name in ("Video","Live","Ditonton"):
              tok=chips.get(name)
              if not tok: continue
              r=post({"continuation":tok})
              i1=ids(r); c1=conts(r)
              out.append("== %s page1 ids=%d top=%s conts=%d"%(name,len(i1),list(r.keys()),len(c1)))
              t2=re.findall(r'"token": "([^"]+)"', " ".join(c1))
              if t2:
                  r2=post({"continuation":t2[-1]})
                  i2=ids(r2)
                  out.append("   page2 ids=%d new=%d top=%s conts=%d"%(len(i2),len(set(i2)-set(i1)),list(r2.keys()),len(conts(r2))))
                  out.append("   page2 sample "+json.dumps(r2)[:1500])
          open("probe2.txt","w").write("\n".join(out))
          PY
          python3 p.py > log.txt 2>&1 || true
          cat log.txt >> probe2.txt || cp log.txt probe2.txt
          gh api -X PUT repos/${{ github.repository }}/contents/probe-${{ github.run_id }}.txt -f message=probe -f branch=probe-out -f content="$(base64 -w0 probe2.txt)"
        env:
          GH_TOKEN: ${{ github.token }}
